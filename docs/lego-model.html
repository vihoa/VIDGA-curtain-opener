<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGO Curtain Carriage – 3D</title>
<style>
:root{--bg:#EEF0F2;--panel:#fff;--ink:#1C232B;--muted:#5B6672;--line:#D5DAE0;--accent:#534AB7;--stage:#E3E7EB}
@media (prefers-color-scheme:dark){:root{--bg:#12161B;--panel:#1A2027;--ink:#E6EAEE;--muted:#9AA5B1;--line:#2C343D;--accent:#AFA9EC;--stage:#0E1216}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px;display:grid;gap:14px}
h1{margin:0;font-size:1.5rem}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:4/3}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:14px;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>LEGO curtain carriage</h1>
  <div class="main">
    <div style="display:grid;gap:8px;min-width:0">
      <div class="stage"><canvas id="cv" aria-label="3D model of the LEGO curtain carriage"></canvas>
        <div class="hint">Drag to rotate · scroll to zoom · right-drag to pan</div></div>
      <div class="bar">
        <button data-v="iso">3D</button><button data-v="end">Along the rail</button>
        <button data-v="side">From the room</button><button data-v="below">From below</button>
      </div>
    </div>
    <aside><strong>Parts</strong><ul id="parts" style="margin-top:8px"></ul></aside>
  </div>
</div>
